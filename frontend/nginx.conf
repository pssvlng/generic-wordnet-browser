server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's DNS resolves the backend again after container replacements.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $wordnet_backend backend:5000;

    # These resource and representation routes belong to Flask. /view stays
    # with Angular. Traefik has already stripped this deployment's prefix.
    location ~ "^/(?:api/dict/|(?:[a-z]{2,3}(?:-[A-Za-z0-9]+)*/)?(?:lemma|synset|ili|id)/|(?:api|ttl|rdf)/(?:[a-z]{2,3}(?:-[A-Za-z0-9]+)*/)?(?:lemma|synset|ili|id)/)" {
        proxy_pass http://$wordnet_backend;
        proxy_set_header Host $http_host;
        proxy_redirect off;
    }

    # History API routes must also load on refresh or a direct visit.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
    }
}
